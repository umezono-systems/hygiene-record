<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315d99">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="衛生管理">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>梅園 衛生管理記録</title>
<style>
:root{--bg:#f5f6f7;--card:#fff;--line:#dfe3e8;--text:#202428;--muted:#6b7280;--accent:#315d99;--ok:#1f7a4d;--ng:#b42318;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px}
.wrap{max-width:980px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-weight:700;font-size:18px}.sub,.muted{font-size:12px;color:var(--muted)}
main{max-width:980px;margin:auto;padding:16px 14px 48px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab,.secondary,.choice{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.tab{border-radius:999px;white-space:nowrap}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:18px 0 8px}p{line-height:1.7}
.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.status-card{border:1px solid var(--line);border-radius:12px;padding:14px}.status{font-weight:700}.ok{color:var(--ok)}.ng{color:var(--ng)}.empty{color:var(--muted)}
.primary{width:100%;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:13px 16px;font-weight:700;cursor:pointer}.row,.choices{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{padding:12px 0;border-top:1px solid #eef0f2}.item:first-child{border-top:0}.item-name{font-size:14px;margin-bottom:8px}
.choice.selected.OK{border-color:var(--ok);background:#ecf8f1;color:var(--ok)}.choice.selected.NG{border-color:var(--ng);background:#fff0ef;color:var(--ng)}.choice.selected.NA{background:#f3f4f6}
.temp-row{display:grid;grid-template-columns:1fr 120px 90px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #eef0f2}
input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;font:inherit}textarea{min-height:70px}.problem{border:1px solid #f0b6b0;background:#fff8f7;border-radius:10px;padding:12px;margin:10px 0}
.notice,.error,.saving{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}.notice{background:#eef4fb;color:#244a78}.error{background:#fff0ef;color:var(--ng)}.saving{background:#fff7e8;color:#8a4b08}
.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:640px){.temp-row{grid-template-columns:1fr 100px}.temp-result{grid-column:2}}
@media print{header,.tabs,#message,.no-print{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{border:0;padding:0}}
</style>
</head>
<body>
<header><div class="wrap head"><div><div class="title">梅園 衛生管理記録</div><div class="sub" id="headerSub">第一製造部</div></div><div class="sub">v0.3_work</div></div></header>
<main>
<div class="tabs no-print">
<button class="tab active" data-view="home">ホーム</button><button class="tab" data-view="today">今日の記録</button><button class="tab" data-view="history">記録一覧</button><button class="tab" data-view="plan">衛生管理計画</button>
</div>
<div id="message"></div>
<section id="view-home"><div class="card"><div class="section-head"><div><h2 id="todayLabel">本日の記録</h2><div class="muted" id="operatorLabel">接続中...</div></div><div id="overallStatus" class="status empty">確認中</div></div><div class="grid" id="homeGrid"></div><br><button class="primary no-print" onclick="showView('today')">今日の記録を入力</button></div></section>
<section id="view-today" class="hidden"><div class="card"><div class="section-head"><div><h2>日次衛生管理</h2><div class="muted" id="recordDateLabel"></div></div><button class="secondary no-print" onclick="saveDraft()">下書き保存</button></div></div><div id="sections"></div><div class="card"><h2>始業時温度</h2><div id="tempStart"></div></div><div class="card"><h2>終業時温度</h2><div id="tempEnd"></div></div><div class="card"><h2>不備・改善対応</h2><div id="actions"></div></div><div class="card"><label class="muted">確定済み記録を修正する場合の理由</label><input id="revisionReason" placeholder="例：終業時温度の入力値を訂正"><br><br><button class="primary no-print" onclick="confirmRecord()">本日の記録を確定</button></div></section>
<section id="view-history" class="hidden"><div class="card"><div class="section-head"><h2>記録一覧</h2><input type="month" id="historyMonth" style="max-width:170px"></div><div id="historyTable"></div></div></section>
<section id="view-plan" class="hidden"><div class="card"><div class="section-head"><div><h2>第一製造部 衛生管理計画</h2><div class="muted">食品衛生責任者：西川 周一郎</div></div><button class="secondary no-print" onclick="window.print()">印刷 / PDF</button></div><div id="planContent"></div></div></section>
</main>
<iframe name="apiWriteFrame" class="hidden"></iframe>
<form id="apiWriteForm" method="post" target="apiWriteFrame" class="hidden">
<input name="action" id="apiAction"><input name="payload" id="apiPayload"><input name="date" id="apiDate"></form>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxpiAl-sBS0RrrCVjKLx60TRORCL0GMNL-BqBVimzjE_Epqc55G43C4vXNcGxwrDqtfCQ/exec";let BOOT=null,RECORD=null,seq=0;
const S={details:{},temperatures:{START:{},END:{}},actions:{}};
document.getElementById('apiWriteForm').action=API_URL;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function showView(v){document.querySelectorAll('section[id^="view-"]').forEach(x=>x.classList.add('hidden'));document.getElementById('view-'+v).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));if(v==='history')loadHistory();if(v==='plan')loadPlan()}
function jp(p){return new Promise((ok,ng)=>{const cb='__hc'+(++seq),s=document.createElement('script');const t=setTimeout(()=>{cleanup();ng(new Error('API応答がタイムアウトしました。'))},15000);function cleanup(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=r=>{cleanup();r&&r.ok?ok(r.data):ng(new Error(r?.error?.message||'APIエラー'))};const u=new URL(API_URL);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('callback',cb);s.src=u;s.onerror=()=>{cleanup();ng(new Error('APIへ接続できませんでした。'))};document.head.appendChild(s)})}
async function init(){try{msg('接続しています...','saving');BOOT=await jp({action:'bootstrap'});headerSub.textContent=(BOOT.facility?.facility_name||'第一製造部')+' ・ '+BOOT.appVersion;todayLabel.textContent=dateJP(BOOT.today)+' の記録';recordDateLabel.textContent=dateJP(BOOT.today);operatorLabel.textContent=BOOT.operator?.name&&BOOT.operator.name!=='未認証'?'記録者（仮）：'+BOOT.operator.name:'記録者：社員マスタ認証は次版で接続';historyMonth.value=BOOT.today.slice(0,7);renderForms();loadRecord(await jp({action:'today'}));clearMsg()}catch(e){err(e)}}
function renderForms(){const ts=[['START','始業時確認'],['RECEIVING','受入確認'],['PRODUCTION','製造時確認'],['END','終業時確認']];sections.innerHTML='';ts.forEach(([t,l])=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="section-head"><h2>${l}</h2><div class="row no-print">${t==='RECEIVING'?'<button class="secondary" onclick="receivingNA()">本日は受入なし</button>':''}<button class="secondary" onclick="allOK('${t}')">この区分をすべて良好</button></div></div><div id="i-${t}"></div>`;sections.appendChild(c);const box=c.querySelector('#i-'+t);BOOT.hygieneItems.filter(i=>i.timing===t).forEach(i=>{const d=document.createElement('div');d.className='item';d.id='item-'+i.item_id;const na=i.allow_na===true||String(i.allow_na)==='true';d.innerHTML=`<div class="item-name">${esc(i.item_name)}</div><div class="choices no-print"><button class="choice" data-r="OK" onclick="setR('${i.item_id}','OK')">○ 良好</button><button class="choice" data-r="NG" onclick="setR('${i.item_id}','NG')">× 不備あり</button>${na?`<button class="choice" data-r="NA" onclick="setR('${i.item_id}','NA')">－ 対象なし</button>`:''}</div>`;box.appendChild(d)})});renderTemps('START',tempStart);renderTemps('END',tempEnd)}
function renderTemps(t,box){box.innerHTML='';BOOT.equipment.forEach(e=>{const d=document.createElement('div');d.className='temp-row';d.innerHTML=`<div>${esc(e.equipment_name)}</div><input type="number" step="0.1" inputmode="decimal" id="t-${t}-${e.equipment_id}" oninput="temp('${t}','${e.equipment_id}',this.value)"><div class="temp-result" id="tr-${t}-${e.equipment_id}">未入力</div>`;box.appendChild(d)})}
function loadRecord(r){RECORD=r;BOOT.hygieneItems.forEach(i=>S.details[i.item_id]='');S.temperatures={START:{},END:{}};S.actions={};(r.details||[]).forEach(d=>S.details[d.item_id]=d.result);(r.temperatures||[]).forEach(t=>S.temperatures[t.timing][t.equipment_id]=Number(t.temperature));(r.actions||[]).forEach(a=>S.actions[a.source_id]={sourceType:a.source_type,sourceId:a.source_id,problem:a.problem||'',cause:a.cause||'',actionTaken:a.action_taken||'',resolutionStatus:a.resolution_status||'RESOLVED',recheckValue:a.recheck_value||''});refresh()}
function refresh(){BOOT.hygieneItems.forEach(i=>{const d=document.getElementById('item-'+i.item_id);if(!d)return;d.querySelectorAll('.choice').forEach(b=>{b.classList.remove('selected','OK','NG','NA');if(S.details[i.item_id]===b.dataset.r)b.classList.add('selected',b.dataset.r)})});['START','END'].forEach(t=>BOOT.equipment.forEach(e=>{const v=S.temperatures[t][e.equipment_id],inp=document.getElementById(`t-${t}-${e.equipment_id}`);inp.value=(v===0||v)?v:'';tempResult(t,e,v)}));renderActions();home()}
function setR(id,r){S.details[id]=r;if(r!=='NG')delete S.actions[id];refresh()}function allOK(t){BOOT.hygieneItems.filter(i=>i.timing===t).forEach(i=>S.details[i.item_id]='OK');refresh()}function receivingNA(){BOOT.hygieneItems.filter(i=>i.timing==='RECEIVING').forEach(i=>S.details[i.item_id]='NA');refresh()}
function temp(t,id,v){if(v==='')delete S.temperatures[t][id];else S.temperatures[t][id]=Number(v);const e=BOOT.equipment.find(x=>x.equipment_id===id),k=id+':'+t;if(tempStatus(e,S.temperatures[t][id])!=='NG')delete S.actions[k];tempResult(t,e,S.temperatures[t][id]);renderActions()}
function tempStatus(e,v){if(v===undefined||v===null||Number.isNaN(Number(v)))return'';return Number(v)<=Number(e.max_temperature)?'OK':'NG'}function tempResult(t,e,v){const x=document.getElementById(`tr-${t}-${e.equipment_id}`),s=tempStatus(e,v);x.className='temp-result '+(s==='OK'?'ok':s==='NG'?'ng':'');x.textContent=s==='OK'?'正常':s==='NG'?'基準外':'未入力'}
function problems(){const a=[];BOOT.hygieneItems.forEach(i=>{if(S.details[i.item_id]==='NG')a.push({key:i.item_id,sourceType:'HYGIENE',sourceId:i.item_id,label:i.item_name})});['START','END'].forEach(t=>BOOT.equipment.forEach(e=>{const v=S.temperatures[t][e.equipment_id];if(tempStatus(e,v)==='NG'){const k=e.equipment_id+':'+t;a.push({key:k,sourceType:'TEMPERATURE',sourceId:k,label:`${e.equipment_name} ${t==='START'?'始業時':'終業時'} ${v}℃`})}}));return a}
function renderActions(){actions.innerHTML='';const ps=problems();if(!ps.length){actions.innerHTML='<div class="notice">現在、不備・基準外項目はありません。</div>';return}ps.forEach(p=>{if(!S.actions[p.key])S.actions[p.key]={sourceType:p.sourceType,sourceId:p.sourceId,problem:p.label,cause:'',actionTaken:'',resolutionStatus:'RESOLVED',recheckValue:''};const a=S.actions[p.key],d=document.createElement('div');d.className='problem';d.innerHTML=`<strong>${esc(p.label)}</strong><br><br><label class="muted">不備内容 *</label><textarea oninput="ua('${p.key}','problem',this.value)">${esc(a.problem)}</textarea><label class="muted">原因</label><textarea oninput="ua('${p.key}','cause',this.value)">${esc(a.cause)}</textarea><label class="muted">対応内容 *</label><textarea oninput="ua('${p.key}','actionTaken',this.value)">${esc(a.actionTaken)}</textarea><div class="choices no-print"><button class="choice ${a.resolutionStatus==='RESOLVED'?'selected OK':''}" onclick="ua('${p.key}','resolutionStatus','RESOLVED');renderActions()">○ 改善済み</button><button class="choice ${a.resolutionStatus==='OPEN'?'selected NG':''}" onclick="ua('${p.key}','resolutionStatus','OPEN');renderActions()">継続対応中</button></div>${p.sourceType==='TEMPERATURE'?`<label class="muted">再確認温度</label><input type="number" step="0.1" value="${esc(a.recheckValue)}" oninput="ua('${p.key}','recheckValue',this.value)">`:''}`;actions.appendChild(d)})}function ua(k,f,v){if(!S.actions[k])S.actions[k]={};S.actions[k][f]=v}
function payload(){return{date:BOOT.today,revisionReason:revisionReason.value.trim(),details:BOOT.hygieneItems.filter(i=>S.details[i.item_id]).map(i=>({itemId:i.item_id,result:S.details[i.item_id],comment:''})),temperatures:['START','END'].flatMap(t=>BOOT.equipment.filter(e=>S.temperatures[t][e.equipment_id]!==undefined).map(e=>({equipmentId:e.equipment_id,timing:t,temperature:S.temperatures[t][e.equipment_id]}))),actions:Object.values(S.actions).filter(a=>a&&String(a.actionTaken||'').trim())}}
function validate(){const m=BOOT.hygieneItems.filter(i=>!S.details[i.item_id]);if(m.length)return`未入力の衛生確認項目が ${m.length} 件あります。`;let n=0;['START','END'].forEach(t=>BOOT.equipment.forEach(e=>{if(S.temperatures[t][e.equipment_id]===undefined)n++}));if(n)return`未入力の温度が ${n} 件あります。`;for(const p of problems()){const a=S.actions[p.key];if(!a||!String(a.problem||'').trim()||!String(a.actionTaken||'').trim())return'不備・基準外項目の対応内容を入力してください。'}return''}
function post(a,p,d=''){apiAction.value=a;apiPayload.value=p?JSON.stringify(p):'';apiDate.value=d;apiWriteForm.submit()}
async function wait(pred,tries=16){let r;for(let i=0;i<tries;i++){await new Promise(x=>setTimeout(x,i?550:800));try{r=await jp({action:'daily',date:BOOT.today});if(pred(r))return r}catch(_){}}throw new Error('保存結果を確認できませんでした。画面を再読み込みして記録をご確認ください。')}
async function saveDraft(){try{msg('下書きを保存しています...','saving');post('saveDailyRecord',payload());loadRecord(await wait(r=>r?.exists&&r.status==='DRAFT'));msg('下書きを保存しました。','notice')}catch(e){err(e)}}
async function confirmRecord(){const v=validate();if(v)return err(new Error(v));try{msg('本日の記録を確定しています...','saving');post('saveAndConfirmDailyRecord',payload());loadRecord(await wait(r=>r?.exists&&r.status==='CONFIRMED',20));msg('本日の記録を確定しました。','notice');showView('home')}catch(e){err(e)}}
function home(){const r=RECORD||{status:'EMPTY',details:[],temperatures:[]};overallStatus.textContent=r.status==='CONFIRMED'?'確定済み':r.exists?'下書き':'未入力';overallStatus.className='status '+(r.status==='CONFIRMED'?'ok':r.exists?'ng':'empty');const dm={},tm={};(r.details||[]).forEach(d=>dm[d.item_id]=d.result);(r.temperatures||[]).forEach(t=>tm[t.equipment_id+':'+t.timing]=t.temperature);const x=[['始業時確認',BOOT.hygieneItems.filter(i=>i.timing==='START').every(i=>dm[i.item_id])],['始業時温度',BOOT.equipment.every(e=>tm[e.equipment_id+':START']!==undefined)],['受入確認',BOOT.hygieneItems.filter(i=>i.timing==='RECEIVING').every(i=>dm[i.item_id])],['製造時確認',BOOT.hygieneItems.filter(i=>i.timing==='PRODUCTION').every(i=>dm[i.item_id])],['終業時確認',BOOT.hygieneItems.filter(i=>i.timing==='END').every(i=>dm[i.item_id])],['終業時温度',BOOT.equipment.every(e=>tm[e.equipment_id+':END']!==undefined)]];homeGrid.innerHTML=x.map(([l,d])=>`<div class="status-card"><div>${l}</div><div class="status ${d?'ok':'empty'}">${d?'完了':'未入力'}</div></div>`).join('')}
async function loadHistory(){try{const rows=await jp({action:'monthly',yearMonth:historyMonth.value});historyTable.innerHTML=rows.length?`<table><thead><tr><th>日付</th><th>状態</th><th>不備</th><th>記録者</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${r.status==='CONFIRMED'?'確定':'下書き'}</td><td>${Number(r.problemCount||0)}</td><td>${esc(r.operator||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="notice">この月の記録はありません。</div>'}catch(e){err(e)}}historyMonth.onchange=loadHistory;
async function loadPlan(){try{const p=await jp({action:'plan'});planContent.innerHTML=`<p><strong>製造所：</strong>${esc(p.facility)}<br><strong>食品衛生責任者：</strong>${esc(p.manager)}<br><strong>使用水：</strong>${esc(p.water)}<br><strong>金属探知機：</strong>${esc(p.metalDetector)}<br><strong>記録保存：</strong>${esc(p.storagePeriod)}</p><h3>温度管理対象</h3><table><tbody>${(p.temperatureTargets||[]).map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.standard)}</td></tr>`).join('')}</tbody></table>${p.sections.map(s=>`<h3>${esc(s.title)}</h3><p>${esc(s.body)}</p>`).join('')}`}catch(e){err(e)}}
function dateJP(s){const d=new Date(s+'T00:00:00');return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}function msg(s,c){message.innerHTML=`<div class="${c}">${esc(s)}</div>`}function err(e){msg(e?.message||String(e),'error');scrollTo({top:0,behavior:'smooth'})}function clearMsg(){message.innerHTML=''}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));init();
</script>
</body></html>
